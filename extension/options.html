<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LeetCode Auto Archive</title>
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:0 20px}
label{display:block;margin-top:18px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:10px;margin-top:7px}
button{margin-top:20px;padding:10px 16px}
#status{margin-top:15px}
</style>
</head>
<body>
<h1>LeetCode Auto Archive</h1>
<p>Enter your Render API URL and archive token.</p>
<label>Render API URL</label>
<input id="apiUrl" placeholder="https://your-service.onrender.com">
<label>Archive token</label>
<input id="archiveToken" type="password" placeholder="Your token">
<button id="save">Save</button>
<div id="status"></div>
<script src="options.js"></script>
</body>
</html>
